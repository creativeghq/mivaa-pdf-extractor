name: 🧩 Modal Deployment (PaddleOCR-VL + SLIG)

# Deploys the Modal GPU apps — PaddleOCR-VL (structural layout + OCR backbone)
# and SLIG (SigLIP2 visual encoder) — whenever their source under modal_app/**
# changes. This is independent of the droplet FastAPI deploy (deploy.yml), which
# ignores modal_app/** so a Modal-only change never restarts the systemd service.
#
# Auth uses the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET GitHub Actions secrets
# (create at https://modal.com/settings/tokens or `modal token new`). Each app's
# own bearer (paddleocr-api-key / slig-api-key Modal secrets) is referenced by
# the app at deploy time and never travels through CI.
on:
  push:
    branches: [ "main", "production" ]
    paths:
      - 'modal_app/**'
      - '.github/workflows/deploy-modal.yml'
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: '📝 Reason for manual Modal deployment'
        required: false
        default: 'Manual Modal deploy'
        type: string
      idol_action:
        description: 'deploy = normal deploy; logs = print Idol container logs; stop = stop the Idol app (no GPU spend)'
        required: false
        default: 'deploy'
        type: choice
        options: [deploy, logs, stop]

# Serialize Modal deploys so two pushes don't race `modal deploy` on the same app.
concurrency:
  group: deploy-modal-prod
  cancel-in-progress: false

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🧱 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Modal CLI
        run: pip install --upgrade modal

      - name: 🚀 Deploy Modal apps (PaddleOCR-VL + SLIG)
        if: github.event_name != 'workflow_dispatch' || inputs.idol_action == 'deploy'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_TOKEN_ID:-}" ] || [ -z "${MODAL_TOKEN_SECRET:-}" ]; then
            echo "❌ MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set in GitHub Actions secrets."
            echo "   Add them (Settings → Secrets and variables → Actions) from https://modal.com/settings/tokens"
            exit 1
          fi
          # Deploy every Modal app. Re-deploying an unchanged app is cheap and
          # idempotent — Modal only rebuilds the image when that app's own inputs
          # changed, so a paddleocr_vl.py edit won't rebuild the SLIG image and
          # vice-versa. Add new modal_app/*.py apps to this list.
          echo "Deploying modal_app/paddleocr_vl.py to Modal (app: paddleocr-vl)…"
          modal deploy modal_app/paddleocr_vl.py
          echo "Deploying modal_app/slig.py to Modal (app: slig)…"
          modal deploy modal_app/slig.py
          echo "✅ Modal deploy complete."
          echo "## 🧩 Modal Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed \`modal_app/paddleocr_vl.py\` (app \`paddleocr-vl\`) and \`modal_app/slig.py\` (app \`slig\`) to Modal." >> "$GITHUB_STEP_SUMMARY"

      - name: 🧊 Deploy Idol (image → 3D splat)
        if: github.event_name != 'workflow_dispatch' || inputs.idol_action == 'deploy'
        # Separate step: its build downloads two gated Hugging Face repos, and a missing licence
        # acceptance must not stop PaddleOCR-VL or SLIG from deploying.
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HUGGING_FACE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then echo "❌ HUGGING_FACE_ACCESS_TOKEN is not set"; exit 1; fi
          modal secret create huggingface-token HF_TOKEN="$HF_TOKEN" --force >/dev/null
          modal deploy modal_app/idol_splat.py
          echo "Deployed \`modal_app/idol_splat.py\` (app \`idol\`) to Modal." >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Idol health check (prints container logs on failure)
        if: github.event_name != 'workflow_dispatch' || inputs.idol_action == 'deploy'
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -uo pipefail
          URL="https://basilakis--idol-idolservice-web.us-east.modal.run/health"
          BODY=$(curl -s -m 600 "$URL" || true); echo "$BODY"
          if echo "$BODY" | grep -q '"model":"idol"'; then echo "✅ Idol serving"; exit 0; fi
          echo "❌ Idol did not answer /health within 10 minutes — container logs:"
          timeout 120 modal app logs idol || true
          exit 1

      - name: 🧊 Idol logs / stop (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.idol_action != 'deploy'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -uo pipefail
          if [ "${{ inputs.idol_action }}" = "stop" ]; then modal app stop idol; echo "Idol stopped"; exit 0; fi
          timeout 150 modal app logs idol || true
